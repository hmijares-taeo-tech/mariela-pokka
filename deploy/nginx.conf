server {
    listen 80;
    server_name marielapokka.com www.marielapokka.com;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend estático
    root /usr/share/nginx/html;
    index index.html;

    # Imágenes del catálogo de productos
    location /catalog-images/ {
        alias /usr/share/nginx/html/catalog-images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Store y Admin de Medusa
    location /store/ {
        proxy_pass http://backend:9000/store/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /admin/ {
        proxy_pass http://backend:9000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /app {
        proxy_pass http://backend:9000/app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
