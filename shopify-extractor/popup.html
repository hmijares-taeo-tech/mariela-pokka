<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Shopify Rescuer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 360px;
      background: #111827;
      color: #f3f4f6;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .badge {
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #374151;
      color: #e5e7eb;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
    .btn-success {
      background: #10b981;
      color: white;
    }
    .btn-success:hover {
      background: #059669;
    }
    #log {
      margin-top: 12px;
      padding: 10px;
      background: #030712;
      border-radius: 6px;
      border: 1px solid #1f2937;
      font-family: monospace;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #a7f3d0;
    }
    .status-box {
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <h2><span>⚡ Shopify Rescuer</span> <span class="badge">URGENTE</span></h2>
  <p>Extracción de productos, variantes e imágenes sin alterar la sesión activa.</p>

  <div class="status-box">
    <span>Productos rescatados:</span>
    <strong id="product-count" style="color: #38bdf8;">0</strong>
  </div>

  <button id="btn-extract-graphql" class="btn btn-primary">1. Extraer Todo (GraphQL API)</button>
  <button id="btn-extract-rest" class="btn btn-secondary">2. Extraer por REST (/products.json)</button>
  <button id="btn-download" class="btn btn-success" disabled>3. Descargar JSON al Disco</button>

  <div id="log">Esperando orden... Asegúrate de estar en la pestaña de Shopify Admin.</div>

  <script src="popup.js"></script>
</body>
</html>
